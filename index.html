<style>
:root {
  --bg: #F4F3EF;
  --ink: #16251F;
  --muted: #6B665C;
  --gold: #946F33;
  --gold-hi: #F0C36A;
  --line: #D9D4C8;
  --dark: #1A1413;
  --brand: #BE2029;
  --on-dark: #F6EBDD;
  --font-latin: "Playfair Display", Georgia, serif;
  --font-ar: "Lalezar", "Tajawal", sans-serif;
  --font-body: "Tajawal", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16110F; --ink: #F1ECE2; --muted: #B5AA9B; --gold: #D3B07A; --line: #3B2F2B; --dark: #0D0A09;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16110F; --ink: #F1ECE2; --muted: #B5AA9B; --gold: #D3B07A; --line: #3B2F2B; --dark: #0D0A09;
  color-scheme: dark;
}
:root { color-scheme: light; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }
body { margin: 0; touch-action: manipulation; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
img { max-width: 100%; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
.wrap { max-width: 640px; margin-inline: auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }

/* masthead: dark band with a scalloped lower edge, like the reference */
.hero { background: var(--dark); color: var(--on-dark); text-align: center; padding-block: calc(env(safe-area-inset-top, 0px) + 26px) 14px; }
.logo { font-family: var(--font-ar); font-size: 3rem; line-height: 1.3; color: var(--gold-hi); }
.en { direction: ltr; font-weight: 800; font-size: 0.72rem; letter-spacing: 0.26em; }
.scallop { height: 22px; background: radial-gradient(circle at 22px 100%, var(--bg) 21px, transparent 22px) 0 0 / 44px 22px repeat-x var(--dark); }
.menu-word { direction: ltr; text-align: center; font-family: var(--font-latin); font-weight: 900; font-size: 3.4rem; line-height: 1.1; letter-spacing: 0.01em; padding-block: 30px 6px; }

.searchbox { padding-block: 14px 8px; }
.search { width: 100%; font: inherit; padding: 0.65rem 1.1rem; border: 1.5px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink); }
.search::placeholder { color: var(--muted); }
.search:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; }

.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.chips { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; min-height: 46px; padding: 0 0.9rem; border-bottom: 3px solid transparent; color: var(--muted); font-weight: 700; font-size: 1rem; text-decoration: none; white-space: nowrap; }
.chip:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }
.chip[aria-current="true"] { color: var(--ink); border-bottom-color: var(--brand); }

main { padding-block: 10px 30px; }
.sec { padding-top: 34px; min-width: 0; scroll-margin-top: calc(var(--nav-h, 50px) + env(safe-area-inset-top, 0px) + 4px); }
.sec h2 { margin: 0; text-align: center; font-family: var(--font-ar); font-weight: 400; font-size: 1.95rem; line-height: 1.4; padding-bottom: 0.3rem; border-bottom: 2px solid var(--ink); }
.note { margin: 10px 0 0; text-align: center; color: var(--gold); font-weight: 700; font-size: 0.92rem; }
.item { padding-block: 16px; border-bottom: 1px solid var(--line); }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
.info { min-width: 0; flex: 1; }
.name { font-weight: 800; font-size: 1.2rem; line-height: 1.45; }
.desc { margin-top: 0.1rem; color: var(--muted); font-size: 0.88rem; line-height: 1.65; }
.pr { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.ln { display: flex; align-items: baseline; gap: 0.4rem; direction: ltr; white-space: nowrap; }
.ln b { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.3; }
.ln u { text-decoration: none; color: var(--gold); font-weight: 700; font-size: 0.95rem; }
.ln i { font-style: normal; color: var(--muted); font-size: 0.8rem; font-weight: 500; }
.pr.two .ln b { font-size: 1.3rem; }
.sizes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px dotted var(--line); text-align: center; }
.sz i { display: block; font-style: normal; color: var(--muted); font-size: 0.8rem; font-weight: 500; line-height: 1.5; }
.sz b { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.3; }
.sz.na b { color: var(--line); font-weight: 400; }
.empty { margin: 40px auto; text-align: center; color: var(--muted); font-weight: 700; }

footer { background: var(--dark); color: var(--on-dark); text-align: center; padding-block: 26px calc(env(safe-area-inset-bottom, 0px) + 28px); }
footer p { margin: 0; font-weight: 700; }
.phones { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 14px; direction: ltr; }
.phones a { display: flex; align-items: center; justify-content: center; min-height: 46px; border: 1.5px solid rgba(246, 235, 221, 0.5); border-radius: 999px; color: var(--on-dark); font-weight: 700; font-variant-numeric: tabular-nums; text-decoration: none; }
.phones a:last-child { grid-column: 1 / -1; }
.phones a:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 2px; }
.small { margin-top: 14px; font-size: 0.82rem; font-weight: 500; opacity: 0.9; }
</style>
</head>

<div class="page" dir="rtl" lang="ar">
  <header class="hero">
    <div class="wrap">
      <div class="logo">الزهراء</div>
      <div class="en">EL ZAHRAA · PIZZA &amp; CREPE</div>
    </div>
  </header>
  <div class="scallop" aria-hidden="true"></div>
  <div class="wrap"><div class="menu-word">MENU</div></div>

    <input class="search" id="q" type="search" placeholder="ابحث عن صنف، مثلاً شاورما أو نوتيلا" aria-label="ابحث في المنيو" autocomplete="off">
  </div>
  <div class="nav" id="nav">
    <div class="wrap"><nav class="chips" id="chips" aria-label="أقسام المنيو"></nav></div>
  </div>

  <main class="wrap" id="menu"></main>
  <p class="empty wrap" id="empty" hidden>لا توجد أصناف مطابقة للبحث.</p>

  <footer>
    <div class="wrap">

      <div class="phones" id="phones"></div>

    </div>
  </footer>
</div>

      ["بوكس وتش كرانش", "", [150]],
      ["بوكس وتش سجق اسكندراني", "", [150]],
      ["بوكس وتش مشكل جبن", "", [100]],
      ["بوكس وتش الزهراء", "", [180]]
    ]}
  ];

  var PHONES = ["01142047495", "01033320168", "01008094344", "0502218799", "0504038877"];

  var main = document.getElementById("menu");
  var chipsBox = document.getElementById("chips");
  var nav = document.getElementById("nav");
  var emptyMsg = document.getElementById("empty");
  var q = document.getElementById("q");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function norm(s) {
    return String(s)
      .replace(/[ً-ْـ]/g, "")
      .replace(/[أإآ]/g, "ا")
      .replace(/ى/g, "ي")
      .replace(/ة/g, "ه")
      .toLowerCase();
  }
  function line(label, value) {
    var d = el("div", "ln");
    if (label) d.appendChild(el("i", null, label));
    d.appendChild(el("b", null, String(value)));
    d.appendChild(el("u", null, "EGP"));
    return d;
  }

  var secs = [];
  CATS.forEach(function (c) {
    var link = el("a", "chip", c.chip || c.title);
    link.href = "#" + c.id;
    chipsBox.appendChild(link);

    var s = el("section", "sec");
    s.id = c.id;
    s.appendChild(el("h2", null, c.title));
    if (c.note) s.appendChild(el("p", "note", c.note));

    var rows = [];
    c.items.forEach(function (it) {
      var n = c.sizes ? c.sizes.length : 1;
      var row = el("div", "item");
      row.dataset.s = norm(it[0] + " " + it[1] + " " + c.title);

      var top = el("div", "top");
      var info = el("div", "info");
      info.appendChild(el("div", "name", it[0]));
      if (it[1]) info.appendChild(el("div", "desc", it[1]));
      top.appendChild(info);

      if (n <= 2) {
        var pr = el("div", "pr" + (n === 2 ? " two" : ""));
        if (n === 1) {
          pr.appendChild(line("", it[2][0]));
        } else {
          for (var i = c.sizes.length - 1; i >= 0; i--) {
            if (it[2][i] != null) pr.appendChild(line(c.sizes[i], it[2][i]));
          }
        }
        top.appendChild(pr);
        row.appendChild(top);
      } else {
        row.appendChild(top);
        var grid = el("div", "sizes");
        c.sizes.forEach(function (label, i) {
          var v = it[2][i];
          var cell = el("div", "sz" + (v == null ? " na" : ""));
          cell.appendChild(el("i", null, label));
          var b = el("b", null, v == null ? "–" : String(v));
          if (v == null) b.setAttribute("aria-label", "غير متاح");
          cell.appendChild(b);
          grid.appendChild(cell);
        });
        row.appendChild(grid);
      }
      s.appendChild(row);
      rows.push(row);
    });
    main.appendChild(s);
    secs.push({ el: s, link: link, rows: rows });
  });

  var phones = document.getElementById("phones");
  PHONES.forEach(function (n) {
    var a = el("a", null, n);
    a.href = "tel:" + n;
    phones.appendChild(a);
  });

  function filter() {
    var term = norm(q.value.trim());
    var shown = 0;
    secs.forEach(function (o) {
      var count = 0;
      o.rows.forEach(function (r) {
        var ok = !term || r.dataset.s.indexOf(term) !== -1;
        r.hidden = !ok;
        if (ok) count++;
      });
      o.el.hidden = count === 0;
      o.link.hidden = count === 0;
      shown += count;
    });
    emptyMsg.hidden = shown !== 0;
    spy();
  }

  var current = -1;
  function spy() {
    var limit = nav.offsetHeight + 80;
    var idx = 0;
    secs.forEach(function (o, i) {
      if (!o.el.hidden && o.el.getBoundingClientRect().top <= limit) idx = i;
    });
    if (idx === current) return;
    current = idx;
    secs.forEach(function (o, i) {
      if (i === idx) o.link.setAttribute("aria-current", "true");
      else o.link.removeAttribute("aria-current");
    });
    try { secs[idx].link.scrollIntoView({ inline: "center", block: "nearest" }); } catch (e) {}
  }
  function measure() {
    document.documentElement.style.setProperty("--nav-h", nav.offsetHeight + "px");
    spy();
  }

  q.addEventListener("input", filter);
  var ticking = false;
  window.addEventListener("scroll", function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { ticking = false; spy(); });
  }, { passive: true });
  window.addEventListener("resize", measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  measure();
})();
</script>
</body>
</html>
