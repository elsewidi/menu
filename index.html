<style>
/* Layout: the printed menu, kept as cards. Checkered band, red masthead, sticky search and category chips, one bordered card per section with a red label on its top edge. */
:root {
  --bg: #FBF3E2;
  --surface: #FFFDF7;
  --ink: #3A1518;
  --muted: #7A5C57;
  --brand: #BE2029;
  --price: #BE2029;
  --gold: #F4C455;
  --line: #E4CFA8;
  --check: #EBDDC0;
  --on-brand: #FFF7EA;
  --font-display: "Lalezar", "Tajawal", sans-serif;
  --font-body: "Tajawal", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1211;
    --surface: #271817;
    --ink: #F7E9DA;
    --muted: #C2A99E;
    --price: #FF8A8E;
    --line: #4A3230;
    --check: #3A2523;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1211;
  --surface: #271817;
  --ink: #F7E9DA;
  --muted: #C2A99E;
  --price: #FF8A8E;
  --line: #4A3230;
  --check: #3A2523;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 30;
}
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}
.wrap {
  max-width: 780px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.checker {
  height: 18px;
  background: conic-gradient(var(--brand) 25%, var(--check) 0 50%, var(--brand) 0 75%, var(--check) 0) 0 0 / 36px 36px;
}

/* masthead */
.hero {
  background: var(--brand);
  color: var(--on-brand);
  text-align: center;
  padding-block: 26px 28px;
}
.logo {
  display: inline-block;
  padding: 0.05em 0.95em 0.25em;
  border: 3px solid var(--on-brand);
  border-radius: 50%;
  font-family: var(--font-display);
  font-size: 2.7rem;
  line-height: 1.3;
}
.en {
  margin-top: 0.7rem;
  direction: ltr;
  font-weight: 800;
  font-size: 0.78rem;
  letter-spacing: 0.24em;
}
.hero h1 {
  margin: 0.5rem 0 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 2.2rem;
  line-height: 1.3;
  color: var(--gold);
}
.where { margin: 0; font-size: 0.9rem; font-weight: 500; }

/* sticky search and chips */
.nav {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding-block: 8px;
}
.search {
  width: 100%;
  font: inherit;
  padding: 0.6rem 1.1rem;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
}
.search::placeholder { color: var(--muted); }
.search:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; border-color: var(--brand); }
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 1.1rem;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font-weight: 700;
  font-size: 0.98rem;
  text-decoration: none;
  white-space: nowrap;
}
.chip:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; }
.chip[aria-current="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }

/* sections */
main { display: grid; gap: 46px; padding-block: 38px 28px; }
.sec {
  position: relative;
  min-width: 0;
  padding: 36px 16px 8px;
  border: 2.5px solid var(--brand);
  border-radius: 20px;
  background: var(--surface);
  scroll-margin-top: calc(var(--nav-h, 120px) + 44px + env(safe-area-inset-top, 0px));
}
.sec h2 {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translate(-50%, -52%);
  margin: 0;
  padding: 0.1em 1.1em 0.2em;
  border-radius: 10px;
  background: var(--brand);
  color: var(--on-brand);
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1.7rem;
  line-height: 1.3;
  white-space: nowrap;
}
.note {
  margin: 0 0 6px;
  text-align: center;
  color: var(--price);
  font-weight: 700;
  font-size: 0.9rem;
}
.item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 0.55rem 1.2rem;
  padding: 14px 2px;
  border-top: 1.5px dotted var(--line);
}
.note + .item, h2 + .item { border-top: 0; }
.name { font-weight: 800; font-size: 1.08rem; line-height: 1.4; }
.desc { margin-top: 0.1rem; color: var(--muted); font-size: 0.86rem; line-height: 1.55; }
.prices {
  display: grid;
  grid-template-columns: repeat(var(--n, 1), 3.5rem);
  gap: 4px;
  text-align: center;
}
.p { padding: 0.2rem 0 0.25rem; border-radius: 8px; background: var(--bg); }
.p small { display: block; color: var(--muted); font-size: 0.7rem; font-weight: 500; line-height: 1.5; }
.p b { font-size: 1.1rem; font-weight: 800; color: var(--price); font-variant-numeric: tabular-nums; line-height: 1.3; }
.p.na b { color: var(--line); font-weight: 400; }
.one .prices { grid-template-columns: auto; }
.one .p { padding: 0.15rem 0.7rem 0.2rem; }
.one .p b { font-size: 1.35rem; }
@media (max-width: 540px) {
  .item { grid-template-columns: 1fr; }
  .prices { grid-template-columns: repeat(var(--n, 1), 1fr); max-width: 21rem; }
  .item.one { grid-template-columns: 1fr auto; }
  .item.one .prices { grid-template-columns: auto; }
}
.empty { margin: 40px 0; text-align: center; color: var(--muted); font-weight: 700; }
.searchbox { padding-block: 16px 8px; }
@media (max-width: 540px) {
  .hero { padding-block: 14px 16px; }
  .logo { font-size: 2.1rem; border-width: 2px; }
  .en { margin-top: 0.4rem; font-size: 0.72rem; }
  .hero h1 { margin-top: 0.2rem; font-size: 1.5rem; }
  .where { display: none; }
  .searchbox { padding-block: 12px 4px; }
  main { gap: 40px; padding-block: 34px 20px; }
  .sec { padding: 32px 12px 6px; border-width: 2px; }
  .sec h2 { font-size: 1.5rem; }
  .name { font-size: 1.12rem; }
  .desc { font-size: 0.9rem; }
  .prices { gap: 6px; max-width: none; }
  .p { padding: 0.35rem 0 0.4rem; }
  .p small { font-size: 0.78rem; }
  .p b { font-size: 1.25rem; }
  .one .p b { font-size: 1.4rem; }
  .item.two { grid-template-columns: 1fr auto; }
  .item.two .prices { grid-template-columns: repeat(2, 3.7rem); max-width: none; }
  .phones { display: grid; grid-template-columns: repeat(2, 1fr); }
  .phones a { display: flex; align-items: center; justify-content: center; min-height: 44px; }
  .phones a:last-child { grid-column: 1 / -1; }
}

/* footer */
footer {
  margin-top: 8px;
  background: var(--brand);
  color: var(--on-brand);
  text-align: center;
  padding-block: 26px 30px;
}
footer p { margin: 0; font-weight: 700; }
.phones { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; direction: ltr; }
.phones a {
  padding: 0.3rem 0.9rem;
  border: 1.5px solid rgba(255, 247, 234, 0.55);
  border-radius: 999px;
  color: var(--on-brand);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  text-decoration: none;
}
.phones a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.small { margin-top: 14px; font-size: 0.8rem; font-weight: 500; opacity: 0.9; }
</style>

</div>

      ["جبن سجق قطع", "سجق قطع، كيري، موتزاريلا، رومي، شيدر، خضروات", [300, 360, 450, N]],

      ["فطير مشلتت سمنة بلدي", "سمن بلدي أصلي", [130, 170, 230, 280]]
    ]},
    { id: "sweet", title: "الفطير الحلو", chip: "الحلويات", sizes: SZ4, items: [
      ["كريمة", "كريمة، فول، زبيب", [100, 140, 180, 230]],
      ["مكسرات", "فول، زبيب، جوز هند", [100, 140, 180, 230]],
      ["عجوة", "عجوة، فول، زبيب، جوز هند", [100, 140, 180, 230]],
      ["كريمة عجوة", "كريمة، عجوة، فول، زبيب، جوز هند", [120, 150, 190, 250]],
      ["كريمة مكسرات", "كريمة، بندق، لوز، زبيب، جوز هند", [160, 200, 250, 300]],
      ["فطير مكسرات بندق ولوز", "فول، جوز هند، بندق، لوز", [160, 200, 250, 300]],
      ["سادة سكر وشربات", "سمن بلدي، سكر، شربات", [100, 140, 170, 220]],

      ["بوكس وتش سوسيس", "", [130]],
      ["بوكس وتش مشكل فراخ", "", [150]],
      ["بوكس وتش كرانش", "", [150]],
      ["بوكس وتش سجق اسكندراني", "", [150]],
      ["بوكس وتش مشكل جبن", "", [100]],
      ["بوكس وتش الزهراء", "", [180]]
    ]}
  ];

  var PHONES = ["01142047495", "01033320168", "01008094344", "0502218799", "0504038877"];

  var main = document.getElementById("menu");
  var chipsBox = document.getElementById("chips");
  var nav = document.getElementById("nav");
  var emptyMsg = document.getElementById("empty");
  var q = document.getElementById("q");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function norm(s) {
    return String(s)
      .replace(/[ً-ْـ]/g, "")
      .replace(/[أإآ]/g, "ا")
      .replace(/ى/g, "ي")
      .replace(/ة/g, "ه")
      .toLowerCase();
  }

  var secs = [];
  CATS.forEach(function (c) {
    var link = el("a", "chip", c.chip || c.title);
    link.href = "#" + c.id;
    chipsBox.appendChild(link);

    var s = el("section", "sec");
    s.id = c.id;
    s.appendChild(el("h2", null, c.title));
    if (c.note) s.appendChild(el("p", "note", c.note));

    var rows = [];
    c.items.forEach(function (it) {
      var single = !c.sizes;
      var row = el("div", "item" + (single ? " one" : (c.sizes.length === 2 ? " two" : "")));
      row.dataset.s = norm(it[0] + " " + it[1] + " " + c.title);

      var info = el("div");
      info.appendChild(el("div", "name", it[0]));
      if (it[1]) info.appendChild(el("div", "desc", it[1]));
      row.appendChild(info);

      var pr = el("div", "prices");
      if (single) {
        var one = el("div", "p");
        one.appendChild(el("b", null, String(it[2][0])));
        pr.appendChild(one);
      } else {
        c.sizes.forEach(function (label, i) {
          var v = it[2][i];
          var p = el("div", "p" + (v == null ? " na" : ""));
          p.appendChild(el("small", null, label));
          var b = el("b", null, v == null ? "–" : String(v));
          if (v == null) b.setAttribute("aria-label", "غير متاح");
          p.appendChild(b);
          pr.appendChild(p);
        });
        pr.style.setProperty("--n", c.sizes.length);
      }
      row.appendChild(pr);
      s.appendChild(row);
      rows.push(row);
    });
    main.appendChild(s);
    secs.push({ el: s, link: link, rows: rows });
  });

  var phones = document.getElementById("phones");
  PHONES.forEach(function (n) {
    var a = el("a", null, n);
    a.href = "tel:" + n;
    phones.appendChild(a);
  });

  function filter() {
    var term = norm(q.value.trim());
    var shown = 0;
    secs.forEach(function (o) {
      var count = 0;
      o.rows.forEach(function (r) {
        var ok = !term || r.dataset.s.indexOf(term) !== -1;
        r.hidden = !ok;
        if (ok) count++;
      });
      o.el.hidden = count === 0;
      o.link.hidden = count === 0;
      shown += count;
    });
    emptyMsg.hidden = shown !== 0;
    spy();
  }

  var current = -1;
  function spy() {
    var limit = nav.offsetHeight + 60;
    var idx = 0;
    secs.forEach(function (o, i) {
      if (!o.el.hidden && o.el.getBoundingClientRect().top <= limit) idx = i;
    });
    if (idx === current) return;
    current = idx;
    secs.forEach(function (o, i) {
      if (i === idx) o.link.setAttribute("aria-current", "true");
      else o.link.removeAttribute("aria-current");
    });
    try { secs[idx].link.scrollIntoView({ inline: "center", block: "nearest" }); } catch (e) {}
  }
  function measure() {
    document.documentElement.style.setProperty("--nav-h", nav.offsetHeight + "px");
    spy();
  }

  q.addEventListener("input", filter);
  var ticking = false;
  window.addEventListener("scroll", function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { ticking = false; spy(); });
  }, { passive: true });
  window.addEventListener("resize", measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  measure();
})();
</script>
